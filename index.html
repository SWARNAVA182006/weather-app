<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="w-100">
    <div class="container d-flex align-items-center justify-content-center py-3">
      <img id="logo" src="assets/logo.png" alt="logo">
      <h1 class="ms-3 app-title">Weather App</h1>
    </div>
  </header>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- Search -->
        <div class="input-group mb-3 mt-3">
          <input id="cityInput" type="text" class="form-control form-control-lg" placeholder="Enter city name (e.g. Chennai)" aria-label="City name">
          <button id="searchBtn" class="btn btn-warning btn-lg">Search</button>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

        <!-- Weather Card -->
        <section id="weatherCard" class="card text-white d-none mb-4">
          <div class="card-body text-center">
            <h2 id="cityName" class="card-title fs-2"></h2>
            <img id="weatherIcon" class="mb-3 big-icon" alt="weather icon" src="">
            <p id="temperature" class="fs-4 mb-1"></p>
            <p id="feels" class="mb-1"></p>
            <p id="description" class="mb-3"></p>

            <div class="d-flex flex-column align-items-start info-list mx-auto" style="max-width:360px;">
              <p class="mb-2"><img src="assets/icons/humidity.png" class="info-icon" alt="humidity"> <span id="humidity"></span></p>
              <p class="mb-2"><img src="assets/icons/wind.png" class="info-icon" alt="wind"> <span id="wind"></span></p>
              <p class="mb-2"><img src="assets/icons/sunrise.png" class="info-icon" alt="sunrise"> <span id="sunrise"></span></p>
              <p class="mb-2"><img src="assets/icons/sunset.png" class="info-icon" alt="sunset"> <span id="sunset"></span></p>
            </div>

            <div class="mt-3">
              <button id="toggleUnit" class="btn btn-dark me-2">Toggle °C/°F</button>
            </div>
          </div>
        </section>

        <!-- Hourly -->
        <section id="hourlyForecast" class="d-none mb-4">
          <h3 class="text-white">Hourly (next 12 hours)</h3>
          <div id="hourlyContainer" class="d-flex overflow-auto py-2"></div>
        </section>

        <!-- 7-day -->
        <section id="forecast" class="d-none mb-5">
          <h3 class="text-white">7-Day Forecast</h3>
          <div id="forecastContainer" class="d-flex overflow-auto py-2"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
