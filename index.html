<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with logo -->
  <header>
    <img src="logo.png" alt="Logo" id="logo">
    <h1>Weather App</h1>
  </header>

  <!-- Search Box -->
  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="searchBtn">Search</button>
  </div>

  <!-- Error message -->
  <p id="errorMsg" class="hidden"></p>

  <!-- Current Weather Card -->
  <div class="weather-card hidden" id="weatherCard">
    <h2 id="cityName"></h2>
    <img id="weatherIcon" src="" alt="Weather Icon">
    <p id="temperature"></p>
    <p id="feels"></p>
    <p id="description"></p>
    <p id="humidity"></p>
    <p id="wind"></p>
    <p id="sunrise"></p>
    <p id="sunset"></p>
    <button id="toggleUnit">Toggle °C/°F</button>
  </div>

  <!-- 7-Day Forecast -->
  <div class="forecast hidden" id="forecast">
    <h3>7-Day Forecast</h3>
    <div id="forecastContainer" class="forecast-container"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
