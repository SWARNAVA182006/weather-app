<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <!-- LOGO -->
  <div class="logo-container">
    <img src="assets/logo.png" alt="Weather App Logo" class="logo">
  </div>

  <h1>Weather App</h1>

  <div class="search-box">
    <input type="text" id="city-input" placeholder="Enter city name">
    <button id="search-btn">Search</button>
  </div>

  <div id="error-msg" class="error"></div>

  <div class="weather-card d-none">
    <h2 id="city-name">City, Country</h2>
    <img id="weather-icon" src="" alt="Weather Icon">
    <p id="temperature">Temperature: --°C</p>
    <p id="feels-like">Feels Like: --°C</p>
    <p id="description">Weather: --</p>
    <p><img src="assets/icons/humidity.png" class="icon"> <span id="humidity">Humidity: --%</span></p>
    <p><img src="assets/icons/wind.png" class="icon"> <span id="wind">Wind: -- m/s</span></p>
    <p><img src="assets/icons/sunrise.png" class="icon"> <span id="sunrise">Sunrise: --</span></p>
    <p><img src="assets/icons/sunset.png" class="icon"> <span id="sunset">Sunset: --</span></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
